server.port=8080

spring.application.name=UniEnroll-Backend

# Servlet Web UTF-8 Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Microsoft SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=unienroll_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456

# Hibernate & JPA Configuration (Auto DDL Mapping)
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# App JWT Configuration
app.jwt.secret=UniEnrollSecretKeyForJwtAuthenticationSpringSecurityMustBeAtLeast256BitsLong2026!
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Logging
logging.level.root=INFO
logging.level.com.unienroll=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
