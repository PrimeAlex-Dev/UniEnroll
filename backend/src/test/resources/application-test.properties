spring.application.name=UniEnroll-Backend-Test

# Test In-Memory Database (MSSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:unienroll_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT Configuration
app.jwt.secret=UniEnrollSecretKeyForJwtAuthenticationSpringSecurityMustBeAtLeast256BitsLong2026!
app.jwt.access-token-expiration-ms=60000
app.jwt.refresh-token-expiration-ms=300000
